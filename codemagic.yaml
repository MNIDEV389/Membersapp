workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Prepare web assets
        script: |
          mkdir -p out
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <title>MNI Members</title>
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Build iOS App (.app / unsigned debug)
        script: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          # Package .app into a clean .ipa structure
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r MNI-Members-unsigned.ipa Payload
          cp -r "$APP_PATH" .
          zip -r MNI-Members-App.zip $(basename "$APP_PATH")
    artifacts:
      - ios/App/*.ipa
      - ios/App/*.zip
